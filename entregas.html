<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle RDOs — Entregas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2360a5fa' d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z'/%3E%3Cpath fill='%23bfdbfe' d='M14 2v6h6'/%3E%3Cpath fill='%23ffffff' d='M8 12h8v2H8zm0 4h8v2H8z'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#1f2329;
color:white;
text-align:center;
min-height:100vh;
}

/* HEADER */
header{
background:#2b3038;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 18px rgba(0,0,0,0.5);
}

.header-actions{
display:flex;
align-items:center;
gap:10px;
}

.anoSelect{
padding:9px 14px;
border:none;
border-radius:6px;
cursor:pointer;
background:#3a3f48;
color:white;
font-size:14px;
font-weight:600;
outline:none;
transition:0.2s;
}

.anoSelect:hover{
background:#505662;
}

button{
padding:10px 18px;
border:none;
border-radius:6px;
cursor:pointer;
background:#3a3f48;
color:white;
transition:0.2s;
}

button:hover{
background:#505662;
}

/* CONTAINER */
.container{
max-width:1000px;
margin:auto;
padding:40px 20px;
}

/* ÁREAS */
.area-buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-top:25px;
}

.area-btn{
background:#2b3038;
padding:25px;
border-radius:10px;
cursor:pointer;
box-shadow:0 6px 20px rgba(0,0,0,0.4);
transition:0.2s;
}

.area-btn:hover{
transform:translateY(-3px);
}

.area-btn span{
display:block;
font-size:28px;
margin-bottom:8px;
}

/* CARDS */
.cards{
display:flex;
justify-content:center;
gap:20px;
margin-top:30px;
flex-wrap:wrap;
}

.card{
background:#2b3038;
padding:20px;
border-radius:10px;
box-shadow:0 6px 20px rgba(0,0,0,0.4);
min-width:200px;
}

/* SELECT */
select{
padding:8px 12px;
margin-top:15px;
border-radius:6px;
border:none;
background:#3a3f48;
color:white;
outline:none;
}

/* LEGENDA DISCRETA */
.legenda{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin:20px auto 0 auto;
max-width:550px;
font-size:13px;
color:#d0d4dc;
}

.legenda-item{
display:flex;
align-items:center;
gap:6px;
}

.legenda-cor{
width:14px;
height:14px;
border-radius:4px;
display:inline-block;
}

/* CALENDÁRIO */
.calendar{
margin:20px auto;
display:grid;
grid-template-columns:repeat(7,minmax(0,1fr));
gap:6px;
max-width:420px;
}

.day{
background:#2b3038;
aspect-ratio:1/1;
display:flex;
align-items:center;
justify-content:center;
border-radius:6px;
font-size:14px;
box-shadow:0 3px 10px rgba(0,0,0,0.4);
cursor:pointer;
transition:0.2s;
}

.day:active{
transform:scale(0.95);
}

.entregue{
background:#2d9b5f;
}

.pendente{
background:#a13a3a;
}

.fimSemana{
background:#3a3f48;
}

.futuro{
background:#2a2f36;
opacity:0.5;
cursor:default;
}

.hoje{
outline:2px solid #5cff8f;
}

.feriado{
background:#f1f1f1;
color:#111;
font-weight:600;
border:2px solid #ffffff30;
}

/* 📱 MOBILE */
@media (max-width:768px){

header{
flex-direction:column;
padding:15px;
gap:10px;
}

header h1{
font-size:18px;
}

.header-actions{
width:100%;
justify-content:center;
}

.container{
padding:20px 12px;
}

.area-buttons{
grid-template-columns:1fr 1fr;
gap:10px;
}

.area-btn{
padding:15px;
font-size:14px;
}

.area-btn span{
font-size:20px;
}

.cards{
flex-direction:column;
gap:10px;
}

.card{
width:100%;
padding:14px;
font-size:14px;
}

select{
width:100%;
padding:12px;
font-size:15px;
}

button, .anoSelect{
width:100%;
margin-top:10px;
font-size:14px;
}

.legenda{
font-size:12px;
gap:8px;
}

}

</style>
</head>

<body>

<header>
<h1 style="display:flex;align-items:center;gap:10px;"><span style="font-size:26px;">📄</span> Controle RDOs — Entregas</h1>
<div class="header-actions">
  <select id="anoSelector" class="anoSelect" onchange="trocarAno(this.value)"></select>
  <button onclick="window.location.href='index.html'">Início</button>
</div>
</header>

<div class="container">

<h2>Selecione a área</h2>

<div class="area-buttons">

<div class="area-btn" onclick="selecionarArea('Civil')">
<span>🏗</span>Civil
</div>

<div class="area-btn" onclick="selecionarArea('laminacao')">
<span>🧵</span>Laminação
</div>

<div class="area-btn" onclick="selecionarArea('Isolamento')">
<span>🧊</span>Isolamento
</div>

<div class="area-btn" onclick="selecionarArea('Pintura')">
<span>🎨</span>Pintura
</div>

</div>

<div id="infoArea" style="display:none">

<h2 id="tituloArea" style="margin-top:30px;"></h2>

<select id="mesFiltro" onchange="gerarCalendario()">
<option>Janeiro</option>
<option>Fevereiro</option>
<option>Marco</option>
<option>Abril</option>
<option>Maio</option>
<option>Junho</option>
<option>Julho</option>
<option>Agosto</option>
<option>Setembro</option>
<option>Outubro</option>
<option>Novembro</option>
<option>Dezembro</option>
</select>

<div class="cards">

<div class="card">
<h3>RDO entregues</h3>
<p id="entregues">0</p>
</div>

<div class="card">
<h3>Pendentes</h3>
<p id="pendentes">0</p>
</div>

<div class="card">
<h3>Status</h3>
<p id="status">-</p>
</div>

</div>

<!-- Legenda explicativa mantendo o layout -->
<div class="legenda">
  <div class="legenda-item"><span class="legenda-cor" style="background:#2d9b5f"></span> Entregue</div>
  <div class="legenda-item"><span class="legenda-cor" style="background:#a13a3a"></span> Pendente</div>
  <div class="legenda-item"><span class="legenda-cor" style="background:#f1f1f1"></span> Feriado</div>
  <div class="legenda-item"><span class="legenda-cor" style="background:#3a3f48"></span> Fim de Semana</div>
  <div class="legenda-item"><span class="legenda-cor" style="background:#2b3038; outline:2px solid #5cff8f"></span> Hoje</div>
</div>

<div class="calendar" id="calendar"></div>

</div>

</div>

<script>

let dadosRDO = {}
let anoAtual = ""
let areaAtual = ""
let mesAtual = ""

const feriados = [
/* 2026 */
"01.01", // Confraternização Universal
"16.02", // Carnaval
"17.02", // Carnaval
"03.04", // Sexta-feira Santa
"20.04", // Folga empresa
"21.04", // Tiradentes
"01.05", // Dia do Trabalhador
"04.06", // Corpus Christi
"07.09", // Independência
"12.10", // Nossa Senhora
"13.10", // Feriado
"02.11", // Finados
"15.11", // Proclamação
"25.12"  // Natal
]

function normalizar(txt){
  return (txt || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
}

async function carregarDados(){
  try{
    const res = await fetch("/api/rdos")
    dadosRDO = await res.json()

    const anos = Object.keys(dadosRDO)
    if(anos.length === 0) return

    const select = document.getElementById("anoSelector")
    select.innerHTML = ""
    anos.forEach(ano => {
      const opt = document.createElement("option")
      opt.value = ano
      opt.innerText = ano
      select.appendChild(opt)
    })

    const anoSalvo = localStorage.getItem("anoRDO")
    anoAtual = (anoSalvo && anos.includes(anoSalvo)) ? anoSalvo : anos[anos.length - 1]
    select.value = anoAtual

    // Definir mês corrente no seletor inicialmente se for o ano atual
    const hoje = new Date()
    if(hoje.getFullYear() == anoAtual){
      const meses = [
        "Janeiro","Fevereiro","Marco","Abril","Maio","Junho",
        "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
      ]
      document.getElementById("mesFiltro").selectedIndex = hoje.getMonth()
    }

  }catch(e){
    console.error("Erro ao carregar:", e)
  }
}

function trocarAno(novoAno){
  anoAtual = novoAno
  localStorage.setItem("anoRDO", anoAtual)
  if(areaAtual){
    gerarCalendario()
  }
}

function selecionarArea(area){
  areaAtual = area
  document.getElementById("infoArea").style.display = "block"
  document.getElementById("tituloArea").innerText = area + " (" + anoAtual + ")"
  mesAtual = document.getElementById("mesFiltro").value
  gerarCalendario()
}

function gerarCalendario(){
  mesAtual = document.getElementById("mesFiltro").value
  document.getElementById("tituloArea").innerText = areaAtual + " (" + anoAtual + ")"

  if(!dadosRDO[anoAtual]){
    document.getElementById("calendar").innerHTML = "Dados não encontrados para este ano"
    return
  }

  const areaKey = Object.keys(dadosRDO[anoAtual]).find(a => normalizar(a) === normalizar(areaAtual))
  if(!areaKey){
    document.getElementById("calendar").innerHTML = "<p style='grid-column:1/-1; color:#9aa0a6;'>Área não cadastrada para este ano</p>"
    return
  }

  const mesKey = Object.keys(dadosRDO[anoAtual][areaKey] || {}).find(m => normalizar(m) === normalizar(mesAtual))
  const arquivos = (mesKey && dadosRDO[anoAtual][areaKey][mesKey]) ? dadosRDO[anoAtual][areaKey][mesKey] : []

  let diasEntregues = arquivos.map(nome => {
    let match = nome.match(/^(\d{2})/)
    return match ? parseInt(match[1]) : null
  }).filter(Boolean)

  const calendar = document.getElementById("calendar")
  calendar.innerHTML = ""

  let meses = [
    "Janeiro","Fevereiro","Marco","Abril","Maio","Junho",
    "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"
  ]

  let mesIndex = meses.findIndex(m => normalizar(m) === normalizar(mesAtual))
  let diasNoMes = new Date(anoAtual, mesIndex + 1, 0).getDate()

  let entreguesCount = 0
  let pendentesCount = 0

  let hoje = new Date()
  let diaAtual = hoje.getDate()
  let mesAtualNum = hoje.getMonth()
  let anoAtualNum = hoje.getFullYear()

  let isMesAtual = (mesIndex === mesAtualNum && anoAtual == anoAtualNum)
  let isMesPassado = (anoAtual < anoAtualNum || (anoAtual == anoAtualNum && mesIndex < mesAtualNum))
  let isMesFuturo = (anoAtual > anoAtualNum || (anoAtual == anoAtualNum && mesIndex > mesAtualNum))

  let primeiroDia = new Date(anoAtual, mesIndex, 1).getDay()

  for(let i = 0; i < primeiroDia; i++){
    let vazio = document.createElement("div")
    calendar.appendChild(vazio)
  }

  for(let d = 1; d <= diasNoMes; d++){
    let dataDia = new Date(anoAtual, mesIndex, d)
    let diaSemana = dataDia.getDay()

    let div = document.createElement("div")
    div.classList.add("day")
    div.innerText = d

    let dataFormatada =
      String(d).padStart(2, '0') + "." +
      String(mesIndex + 1).padStart(2, '0')

    let isFeriado = feriados.includes(dataFormatada)

    if(d === diaAtual && isMesAtual){
      div.classList.add("hoje")
    }

    if(isFeriado){
      div.classList.add("feriado")
    } else if(diaSemana === 0 || diaSemana === 6){
      div.classList.add("fimSemana")
    } else {
      if(diasEntregues.includes(d)){
        div.classList.add("entregue")
        entreguesCount++

        div.onclick = () => {
          let arquivosDoDia = arquivos.filter(a => a.startsWith(String(d).padStart(2, '0')))
          if(arquivosDoDia.length > 0){
            window.open(`/arquivos/${anoAtual}/${areaKey}/${mesKey}/${encodeURIComponent(arquivosDoDia[0])}`)
          }
        }
      } else {
        if(isMesFuturo || (isMesAtual && d > diaAtual)){
          div.classList.add("futuro")
        } else {
          div.classList.add("pendente")
          pendentesCount++
        }
      }
    }

    calendar.appendChild(div)
  }

  document.getElementById("entregues").innerText = entreguesCount
  document.getElementById("pendentes").innerText = pendentesCount

  let status = document.getElementById("status")

  if(pendentesCount <= 2){
    status.innerHTML = "<span style='color:#5cff8f'>Em dia</span>"
  } else if(pendentesCount <= 5){
    status.innerHTML = "<span style='color:#ffd84d'>Atenção</span>"
  } else {
    status.innerHTML = "<span style='color:#ff5c5c'>Atrasado</span>"
  }
}

carregarDados()

</script>

</body>
</html>
